# The server as it runs for development and for the hand-test artefact.
# Production adds Caddy for TLS and the hourly dump (see the deployment ADR).
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: recipefork
      POSTGRES_USER: recipefork
      POSTGRES_PASSWORD: recipefork
    volumes:
      - db:/var/lib/postgresql/data
  server:
    build:
      context: ../../server
    environment:
      PORT: "8080"
      DATABASE_URL: jdbc:postgresql://db:5432/recipefork
      DATABASE_USER: recipefork
      DATABASE_PASSWORD: recipefork
      # Seals the key sets issued before an account exists (base64, at least 32 bytes).
      # A fixed value for local development and the hand-test artefact only: it is public,
      # so production sets its own secret and keeps it the same across restarts.
      KEY_SET_SECRET: bSB7OUZbKry6DhribkuwCLr0UhfDgA6oz3CO4m7ne0Q=
      # The device attestation service: a fake holding each device's three slots in memory, for local
      # development and the hand-test artefact only. A client sends `fake-device:<label>` as its token;
      # a creation without a token gets no verdict and makes a muted account (AUTH-004).
      ATTESTATION: fake
    ports:
      - "8080:8080"
    depends_on:
      - db
volumes:
  db:
