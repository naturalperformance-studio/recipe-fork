org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
# An idle daemon exits after 15 minutes instead of 3 hours, so forgotten daemons do not fill the RAM.
org.gradle.daemon.idletimeout=900000
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# The application's version, the one place every build takes it from (app/build.gradle.kts): the increment's number,
# MAJOR.MINOR or MAJOR.MINOR.PATCH (a re-upload of the same increment). It is the versionName as written; the
# versionCode is MAJOR * 1000000 + MINOR * 1000 + PATCH (0.25 -> 25000, 0.25.1 -> 25001, 1.0 -> 1000000), so it only
# grows while MINOR and PATCH stay below 1000. Google Play refuses an upload whose versionCode is not above the last.
recipefork.version=0.25
